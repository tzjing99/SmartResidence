name: Feature request
description: Suggest a new capability or improvement.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Tell us the user pain, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Does this align with OpenCondo's principles?
      options:
        - label: Respects owner empowerment & transparency
        - label: Maintains fluid UX (no extra friction)
        - label: Works on self-hosted deployments
