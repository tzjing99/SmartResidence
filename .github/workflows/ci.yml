# SmartResidence CI — runs on push/PR to main.
#
# Local equivalents (match CI without service containers):
#   pnpm install --frozen-lockfile
#   pnpm lint
#   pnpm ci:typecheck
#   pnpm ci:test:shared-types
#   pnpm ci:test:web
#   pnpm ci:test:api          # needs Postgres + Redis (see apps/api/.env.example)
#   pnpm ci:test:regression   # integration + regression (@requires-db)
#   pnpm --filter @smartresidence/web test:e2e   # needs API + DB seeded
#   pnpm build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Dummy values for API boot / billing crypto in CI (never use in production).
  NODE_ENV: test
  BETTER_AUTH_SECRET: ci-test-better-auth-secret-key-0123456789abcdef
  BETTER_AUTH_URL: http://localhost:4000
  S3_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY: ci-test
  S3_SECRET_KEY: ci-test-secret
  BILLING_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:typecheck

  shared-types-test:
    name: Test (shared-types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:test:shared-types

  web-test:
    name: Test (web unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:test:web

  api-test:
    name: Test (API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartresidence
          POSTGRES_PASSWORD: smartresidence
          POSTGRES_DB: smartresidence_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://smartresidence:smartresidence@localhost:5432/smartresidence_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartresidence/shared-types build
      - run: pnpm --filter @smartresidence/api exec prisma generate
      - run: pnpm --filter @smartresidence/api exec prisma migrate deploy
      - run: pnpm ci:test:api
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vitest-report
          path: apps/api/vitest-report
          retention-days: 7

  api-regression:
    name: Test (API integration + regression)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartresidence
          POSTGRES_PASSWORD: smartresidence
          POSTGRES_DB: smartresidence_regression
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://smartresidence:smartresidence@localhost:5432/smartresidence_regression
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartresidence/shared-types build
      - run: pnpm --filter @smartresidence/api exec prisma generate
      - run: pnpm --filter @smartresidence/api exec prisma migrate deploy
      - run: pnpm ci:test:regression
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vitest-regression-report
          path: apps/api/vitest-report
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartresidence/shared-types build
      - run: pnpm --filter @smartresidence/api exec prisma generate
      - run: pnpm build

  e2e-web:
    name: Playwright (web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartresidence
          POSTGRES_PASSWORD: smartresidence
          POSTGRES_DB: smartresidence_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://smartresidence:smartresidence@localhost:5432/smartresidence_e2e
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartresidence/shared-types build
      - run: pnpm --filter @smartresidence/api exec prisma generate
      - run: pnpm --filter @smartresidence/api exec prisma migrate deploy
      - run: pnpm --filter @smartresidence/api run db:seed
      - run: pnpm --filter @smartresidence/api build
      - name: Start API
        run: |
          pnpm --filter @smartresidence/api start > /tmp/api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
          npx --yes wait-on -t 90000 -i 1000 http://localhost:4000/health || {
            echo "::error::API did not become healthy within 90s — log below:";
            cat /tmp/api.log;
            exit 1;
          }
          echo "API is healthy:"; cat /tmp/api.log
      - name: Install Playwright browsers
        run: pnpm --filter @smartresidence/web exec playwright install --with-deps chromium webkit
      - name: Build web
        run: pnpm --filter @smartresidence/web build
      - name: Run e2e
        run: pnpm --filter @smartresidence/web test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
