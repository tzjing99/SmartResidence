name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartresidence/api exec prisma generate
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartresidence_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartresidence_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartresidence/api exec prisma generate
      - run: pnpm --filter @smartresidence/api exec prisma migrate deploy
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartresidence/api exec prisma generate
      - run: pnpm build

  e2e-web:
    name: Playwright (web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartresidence_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartresidence_e2e
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # Boot-time config required by the API env schema (dummy values; the e2e
      # flows only exercise Postgres + Redis, not these external services).
      BETTER_AUTH_SECRET: ci-e2e-better-auth-secret-key-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:4000
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-e2e
      S3_SECRET_KEY: ci-e2e-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartresidence/api exec prisma generate
      - run: pnpm --filter @smartresidence/api exec prisma migrate deploy
      - run: pnpm --filter @smartresidence/api run db:seed
      - run: pnpm --filter @smartresidence/api build
      - name: Start API
        run: |
          pnpm --filter @smartresidence/api start > /tmp/api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
          npx --yes wait-on -t 90000 -i 1000 http://localhost:4000/health || {
            echo "::error::API did not become healthy within 90s — log below:";
            cat /tmp/api.log;
            exit 1;
          }
          echo "API is healthy:"; cat /tmp/api.log
      - name: Install Playwright browsers
        run: pnpm --filter @smartresidence/web exec playwright install --with-deps chromium webkit
      - name: Build web
        run: pnpm --filter @smartresidence/web build
      - name: Run e2e
        # Playwright (CI mode) boots `next start` itself via the webServer config.
        run: pnpm --filter @smartresidence/web test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
