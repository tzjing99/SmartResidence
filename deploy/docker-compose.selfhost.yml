# =============================================================================
# SmartResidence — full local/self-host trial topology
# Infra + API + Web in one stack. This is the source included by the root
# compose.yaml; infra/docker/docker-compose.yml remains the hot-reload dev infra.
#
#   docker compose -f deploy/docker-compose.selfhost.yml --env-file deploy/.env up -d --build
#
# Build context is the REPO ROOT (..) because the Dockerfiles copy the whole
# pnpm workspace. Run this file from the repo root.
# =============================================================================
name: smartresidence

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartresidence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartresidence}
      POSTGRES_DB: ${POSTGRES_DB:-smartresidence}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartresidence} -d ${POSTGRES_DB:-smartresidence}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published by default — only the API needs the DB. Uncomment to inspect.
    # ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-smartresidence}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-smartresidence}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API (residents load QR/pass images from here)
      - "9001:9001"   # MinIO console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-smartresidence} ${S3_SECRET_KEY:-smartresidence};
      mc mb --ignore-existing local/${S3_BUCKET:-sr-uploads};
      mc anonymous set download local/${S3_BUCKET:-sr-uploads}/public;
      echo 'MinIO bucket ready.'
      "

  mailpit:
    # Trial-only outgoing-mail catcher. In production, drop this and point
    # SMTP_* / RESEND_API_KEY at a real provider (see docs/DEPLOYMENT.md).
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "8025:8025"   # Mailpit web UI

  # --- one-shot: apply Prisma migrations, then exit --------------------------
  migrate:
    image: smartresidence/api:${SR_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartresidence}:${POSTGRES_PASSWORD:-smartresidence}@postgres:5432/${POSTGRES_DB:-smartresidence}?schema=public
    # The runtime image ships pnpm + prisma + the migrations folder.
    command: ["sh", "-c", "pnpm exec prisma migrate deploy"]
    restart: "no"

  # --- one-shot tool: load the Acacia Residence demo -------------------------
  # Run explicitly after the stack is healthy:
  #   docker compose run --rm seed
  seed:
    image: smartresidence/api:${SR_IMAGE_TAG:-local}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartresidence}:${POSTGRES_PASSWORD:-smartresidence}@postgres:5432/${POSTGRES_DB:-smartresidence}?schema=public
    command: ["pnpm", "db:seed"]
    restart: "no"

  api:
    image: smartresidence/api:${SR_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartresidence}:${POSTGRES_PASSWORD:-smartresidence}@postgres:5432/${POSTGRES_DB:-smartresidence}?schema=public
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set a 32-byte secret in deploy/.env}
      BETTER_AUTH_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-localhost}
      CORS_ORIGINS: ${WEB_PUBLIC_URL:-http://localhost:3000}
      BILLING_ENCRYPTION_KEY: ${BILLING_ENCRYPTION_KEY:-}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-sr-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-smartresidence}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-smartresidence}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SmartResidence <noreply@smartresidence.local>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      DEFAULT_CONDO_LOCALE: ${DEFAULT_CONDO_LOCALE:-en}
      DEFAULT_CONDO_CURRENCY: ${DEFAULT_CONDO_CURRENCY:-MYR}
      DEFAULT_CONDO_TIMEZONE: ${DEFAULT_CONDO_TIMEZONE:-Asia/Kuala_Lumpur}
    ports:
      - "4000:4000"

  web:
    image: smartresidence/web:${SR_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
      # NEXT_PUBLIC_* is inlined at build time — bake API_PUBLIC_URL into the image.
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:4000}
        NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: ${SHOW_DEMO_CREDENTIALS:-true}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      # Runtime hint only; the value baked at build time (args above) is what the
      # browser bundle actually uses. Rebuild after changing API_PUBLIC_URL.
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: ${SHOW_DEMO_CREDENTIALS:-true}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
